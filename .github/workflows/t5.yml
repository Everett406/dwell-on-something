name: t5
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 用 secret 变量
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "有"
          else
            echo "无"
          fi
      - name: env 里塞 secret
        env:
          DWELL_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: echo "len=${#DWELL_PASS}"

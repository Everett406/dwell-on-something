name: 构建 APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 装 Capacitor
        run: |
          cd app
          npm install --no-audit --no-fund

      - name: 同步到原生工程
        run: cd app && npx cap sync android

      - name: 构建
        working-directory: app
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: dwell-apk
          path: app/android/app/build/outputs/apk/release/*.apk

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # github.token 是 Actions 自动发的令牌，不走 repository secrets，
          # 所以 fork 也能用（fork 读不到 secrets）
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          VERSION="${GITHUB_REF_NAME}"
          cp "$APK" "dwell-${VERSION}.apk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "dwell-${VERSION}.apk" --clobber
            echo "已覆盖更新 $VERSION 的安装包"
          else
            gh release create "$VERSION" "dwell-${VERSION}.apk" --title "dwell ${VERSION}" --notes-file build-notes.md
            echo "已创建 $VERSION"
          fi

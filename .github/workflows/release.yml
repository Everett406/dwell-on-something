name: 构建 APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 装 Capacitor
        run: |
          cd app
          npm install --no-audit --no-fund

      - name: 取签名密钥
        run: |
          mkdir -p keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/dwell.jks
            echo "用仓库密钥正式签名"
          else
            # 没密钥就退回 debug 签名：能装，但每次重跑 key 都变，不能覆盖升级
            echo "没配密钥，退回 debug 签名"
          fi

      - name: 同步到原生工程
        run: cd app && npx cap sync android

      - name: 构建
        working-directory: app
        env:
          DWELL_KEYSTORE: ${{ github.workspace }}/keystore/dwell.jks
          DWELL_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          DWELL_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "--- 产物 ---"
          ls -la app/build/outputs/apk/release/

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: dwell-apk
          path: app/android/app/build/outputs/apk/release/*.apk

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/*.apk
          body: |
            把下面的 APK 传到手机上打开安装即可（需要允许「安装未知来源应用」）。

            APK 是自签名包。第一次装的时候手机会拦一下，选「继续安装」。

            装完进 **设置 → 模型接入**，选协议、填地址和令牌，就能开聊。

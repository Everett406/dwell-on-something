name: 构建 APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 缓存 Gradle 和 Android 构建
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
            app/android/app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle', 'app/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 装 Capacitor
        run: |
          cd app
          npm install --no-audit --no-fund

      - name: 同步到原生工程
        run: cd app && npx cap sync android

      - name: 构建
        working-directory: app
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: dwell-apk
          path: app/android/app/build/outputs/apk/release/*.apk

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # fork 仓库的 workflow 拿不到 GITHUB_TOKEN（GitHub 的安全策略：
          # 防止别人通过改 fork 的 workflow 窃取凭据）。没有令牌就跳过，
          # 安装包已经在上面的 artifact 里，发布走 tools/upload-apk.js。
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::warning::这是 fork，CI 没有 GITHUB_TOKEN，自动发 Release 跳过。"
            echo "::warning::安装包已作为 artifact 上传。本地发版："
            echo "::warning::  node tools/upload-apk.js"
            exit 0
          fi
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          VERSION="${GITHUB_REF_NAME}"
          cp "$APK" "dwell-${VERSION}.apk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "dwell-${VERSION}.apk" --clobber
            echo "已覆盖更新 $VERSION 的安装包"
          else
            gh release create "$VERSION" "dwell-${VERSION}.apk" --title "dwell ${VERSION}" --notes-file build-notes.md
            echo "已创建 $VERSION"
          fi

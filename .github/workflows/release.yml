name: 构建 APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 装 Capacitor
        run: |
          cd app
          npm install --no-audit --no-fund

      - name: 取签名密钥
        run: |
          mkdir -p keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/dwell.jks
            echo "用仓库密钥正式签名（可覆盖升级）"
          else
            echo "没配密钥，退回 debug 签名（可装，但不能覆盖升级）"
          fi

      - name: 同步到原生工程
        run: cd app && npx cap sync android

      - name: 构建
        working-directory: app
        env:
          DWELL_KEYSTORE: ${{ github.workspace }}/keystore/dwell.jks
          DWELL_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          DWELL_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: dwell-apk
          path: app/android/app/build/outputs/apk/release/*.apk

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          VERSION="${GITHUB_REF_NAME}"
          cp "$APK" "dwell-${VERSION}.apk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "dwell-${VERSION}.apk" --clobber
            echo "已覆盖更新 $VERSION 的安装包"
          else
            gh release create "$VERSION" "dwell-${VERSION}.apk" --title "dwell ${VERSION}" --notes-file build-notes.md
            echo "已创建 $VERSION"
          fi
